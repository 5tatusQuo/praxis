name: praxis-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Secrets and workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: Workflow lint (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Helm chart lint
        run: >
          docker run --rm -v "$PWD/deploy/helm:/charts" alpine/helm:3.19.0 lint /charts/praxis
          --set secrets.create=true --set secrets.apiToken=x --set postgres.password=y
      - name: Terraform format and validate (AWS module)
        run: |
          tf() { docker run --rm -v "$PWD/deploy/terraform/aws:/tf" -w /tf hashicorp/terraform:1.14 "$@"; }
          tf fmt -check -diff
          tf init -backend=false -input=false > /dev/null
          tf validate

  validate:
    name: Validate, test and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Code style
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -q
      - name: Content schema, docs and tuning hooks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            uv run praxis validate --base "origin/$BASE_REF"
          else
            uv run praxis validate
          fi
      - name: packs.lock pins exactly what would deploy
        run: uv run praxis lock --check
      - name: Render every client
        run: uv run praxis render --out rendered
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-rules
          path: rendered/

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  lab:
    name: Lab staging (replay test events)
    needs: validate
    # The lab SIEM is on the self-hosted runner. Never run code from forks there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, praxis]
    env:
      # The lab connection and key live in a file on the runner, not in GitHub.
      PRAXIS_ENV_FILE: /etc/praxis/lab.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # Replays only the detections a change can affect; any change outside
      # the content folder replays them all.
      - name: Replay test events in the lab SIEM
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: uv run praxis lab test --changed-since "$BASE"
