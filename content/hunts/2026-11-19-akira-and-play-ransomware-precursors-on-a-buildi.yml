id: 2026-11-19-akira-and-play-ransomware-precursors-on-a-buildi
prompt: 'Akira and Play ransomware precursors on a building contractor''s Windows estate: domain discovery,
  credential dumping and shadow copy deletion'
created: '2026-11-19'
clients:
- halverstone
summary: The sampled deletion commands resemble backup maintenance, not confirmed ransomware activity.
  File artifact checks remain untested because file events are missing. The queries test selected behaviors,
  not actor attribution.
hypotheses:
- title: Commands enumerate domain trusts
  technique: T1482
  rationale: Reported domain trust discovery supports testing commands that reveal trust relationships.
  query: 'process where host.os.type == "windows" and event.type == "start" and ((process.name : "nltest.exe"
    and process.command_line : ("*/domain_trusts*", "*/all_trusts*")) or (process.name : ("powershell.exe",
    "pwsh.exe") and process.command_line : ("*Get-ADTrust*", "*GetAllTrustRelationships*")))'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. This test cannot exclude discovery through other tools. Routine
    administration can use these commands.
  durable: false
  results:
    halverstone:
      hits: 0
      days: 30
  tested: true
- title: Commands enumerate computers in a domain
  technique: T1018
  rationale: Both actors reportedly discover remote systems. Domain enumeration can identify targets before
    lateral movement.
  query: 'process where host.os.type == "windows" and event.type == "start" and process.name : ("net.exe",
    "net1.exe") and process.command_line : "* view *" and process.command_line : "*/domain*"'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. Reuse the existing library detection if needed. Routine administration
    can use this command.
  durable: false
  results:
    halverstone:
      hits: 0
      days: 30
  tested: true
- title: Commands request credential dumps from LSASS
  technique: T1003.001
  rationale: Reported credential dumping supports testing explicit LSASS dump commands beyond the existing
    comsvcs detection.
  query: 'process where host.os.type == "windows" and event.type == "start" and ((process.name : ("procdump*.exe",
    "createdump.exe") and process.command_line : "*lsass*") or (process.command_line : ("*sekurlsa::*",
    "*lsadump::*")))'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. The query cannot detect every renamed tool or commands executed
    inside an existing process.
  durable: true
  results:
    halverstone:
      hits: 0
      days: 30
  tested: true
- title: Commands create installation media containing directory credentials
  technique: T1003.003
  rationale: Reported credential dumping supports testing directory database extraction through installation
    media creation.
  query: 'process where host.os.type == "windows" and event.type == "start" and process.name : "ntdsutil.exe"
    and process.command_line : "*ifm*" and process.command_line : "*create*"'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. Command evidence alone cannot confirm database extraction.
    Check maintenance approval if this behavior appears.
  durable: true
  results:
    halverstone:
      hits: 0
      days: 30
  tested: true
- title: Commands delete shadow copies
  technique: T1490
  rationale: The requested deletion behavior can remove recovery options. The actor lookup does not establish
    this technique for either actor.
  query: 'process where host.os.type == "windows" and event.type == "start" and ((process.name : "vssadmin.exe"
    and process.command_line : "*delete*shadows*") or (process.name : "wmic.exe" and process.command_line
    : "*shadowcopy*delete*") or (process.name : ("powershell.exe", "pwsh.exe") and process.command_line
    : "*Win32_ShadowCopy*" and process.command_line : ("*Delete*", "*Remove-CimInstance*")))'
  indices:
  - logs-endpoint.events.process-*
  assessment: Samples show a backup agent deleting the oldest shadow copy on D:. Confirm maintenance approval.
    Review remaining events before tuning the existing detection.
  durable: false
  results:
    halverstone:
      hits: 28
      days: 30
  tested: true
