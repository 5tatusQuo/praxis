id: 2026-11-19-drawing-theft-and-ransomware-staging-by-akira-pl
prompt: 'Drawing theft and ransomware staging by Akira, Play and Medusa at a building contractor and engineering
  firm: credential dumping, shadow copy deletion and archiving of drawings on Windows hosts'
created: '2026-11-19'
clients:
- corvenhallow
summary: The samples suggest backup maintenance, not confirmed ransomware. File creation and archive contents
  remain untested because file telemetry is missing. Process searches do not establish actor attribution.
hypotheses:
- title: Utilities attempt to dump LSASS memory
  technique: T1003.001
  rationale: Reported credential dumping supports testing whether utilities target LSASS through process
    commands.
  query: 'process where host.os.type == "windows" and event.type == "start" and ((process.name : ("procdump.exe",
    "procdump64.exe") and process.command_line : "* -ma *" and process.command_line : "*lsass*") or (process.name
    : "rundll32.exe" and process.command_line : "*comsvcs*" and process.command_line : ("*MiniDump*",
    "*#24*")))'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. The query misses renamed utilities and numeric LSASS targets.
    Retain the existing detection for the overlapping behavior.
  durable: true
  results:
    corvenhallow:
      hits: 0
      days: 30
  tested: true
- title: Utilities delete shadow copies before encryption
  technique: T1490
  rationale: Reported recovery inhibition supports testing whether Windows utilities delete shadow copies
    or resize shadow storage.
  query: 'process where host.os.type == "windows" and event.type == "start" and ((process.name : ("powershell.exe",
    "pwsh.exe", "wmic.exe", "vssadmin.exe", "diskshadow.exe") and process.command_line : "*shadow*" and
    process.command_line : "*delete*") or (process.name : "vssadmin.exe" and process.command_line : "*resize*"
    and process.command_line : "*shadowstorage*"))'
  indices:
  - logs-endpoint.events.process-*
  assessment: The samples show a backup agent deleting the oldest shadow copy. Confirm the maintenance
    authorization before treating these events as benign.
  durable: false
  results:
    corvenhallow:
      hits: 29
      days: 30
  tested: true
- title: Archivers collect drawings for theft
  technique: T1560.001
  rationale: Reported archiving supports testing whether archive commands name drawing files or engineering
    folders.
  query: 'process where host.os.type == "windows" and event.type == "start" and process.name : ("7z.exe",
    "7za.exe", "7zr.exe", "rar.exe", "winrar.exe") and process.command_line : ("* a *", "* u *") and process.command_line
    : ("*.dwg*", "*.dxf*", "*.rvt*", "*.ifc*", "*drawings*", "*\\BIM\\*")'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. Generic folder paths and other archivers remain outside this
    query. Inspect suspected archives to establish their contents.
  durable: false
  results:
    corvenhallow:
      hits: 0
      days: 30
  tested: true
- title: A directory utility stages domain credentials
  technique: T1003.003
  rationale: Reported directory database dumping supports testing whether a Windows utility creates installation
    media that can contain domain credentials.
  query: 'process where host.os.type == "windows" and event.type == "start" and process.name : "ntdsutil.exe"
    and process.command_line : "*ifm*" and process.command_line : "*create*"'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. Future matches require checks against approved directory
    maintenance. This query does not establish database access or successful creation.
  durable: true
  results:
    corvenhallow:
      hits: 0
      days: 30
  tested: true
