id: 2026-11-19-akira-and-play-ransomware-precursors-at-a-buildi-3
prompt: 'Akira and Play ransomware precursors at a building contractor: remote tool downloads, shadow
  copy deletion and lateral movement on Windows file servers holding drawings'
created: '2026-11-19'
clients:
- thackwell
summary: Prioritize shadow deletion outside the observed backup command. These events do not establish
  ransomware activity. Confirm which hosts hold drawings. Missing file events prevent tests for access
  to drawings.
hypotheses:
- title: Download utilities retrieved remote access tools
  technique: T1105
  rationale: Play transfers tools, and Akira uses remote access tools. Download commands can expose preparation
    for remote control.
  query: 'process where host.os.type == "windows" and event.type == "start" and process.name : ("powershell.exe",
    "pwsh.exe", "curl.exe", "certutil.exe", "bitsadmin.exe") and process.command_line : ("*http://*",
    "*https://*") and process.command_line : ("*anydesk*", "*screenconnect*", "*connectwise*", "*splashtop*",
    "*rustdesk*", "*atera*", "*teamviewer*")'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. This name-based search misses renamed tools and browser downloads.
    Check approved remote access tools before expanding the search.
  durable: false
  results:
    thackwell:
      hits: 0
      days: 30
  tested: true
- title: Commands removed shadow copies outside the observed backup command
  technique: T1490
  rationale: Recovery removal tests the requested ransomware precursor. The supplied actor records do
    not establish this technique for either actor.
  query: 'process where host.os.type == "windows" and event.type == "start" and ((process.name : "vssadmin.exe"
    and process.command_line : ("*delete*shadows*", "*resize*shadowstorage*")) or (process.name : "wmic.exe"
    and process.command_line : "*shadowcopy*delete*") or (process.name : ("powershell.exe", "pwsh.exe")
    and process.command_line : "*Win32_ShadowCopy*" and process.command_line : ("*delete*", "*Remove-CimInstance*",
    "*Remove-WmiObject*"))) and not (process.parent.executable : "C:\\Program Files\\SiteBackup\\sitebackup-agent.exe"
    and process.command_line : "vssadmin.exe delete shadows /for=D: /oldest /quiet")'
  indices:
  - logs-endpoint.events.process-*
  assessment: Shadow deletion and storage reduction share one account and host. Confirm authorization
    and the server role. Review the existing detection before retaining this backup exclusion.
  durable: true
  results:
    thackwell:
      hits: 4
      days: 30
  tested: true
- title: Commands used administrative shares or created remote services
  technique: T1021.002
  rationale: Play uses administrative shares for lateral movement. Command execution can expose access
    attempts before activity reaches servers that hold drawings.
  query: 'process where host.os.type == "windows" and event.type == "start" and ((process.name : ("net.exe",
    "net1.exe") and process.command_line : "* use *" and process.command_line : ("*\\\\*\\ADMIN$*", "*\\\\*\\C$*"))
    or (process.name : ("psexec.exe", "psexec64.exe") and process.command_line : "*\\\\*") or (process.name
    : "sc.exe" and process.command_line : "*\\\\*" and process.command_line : "* create *"))'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. This does not exclude other SMB activity. Reuse the existing
    administrative share detection, and confirm which hosts hold drawings.
  durable: true
  results:
    thackwell:
      hits: 0
      days: 30
  tested: true
- title: RDP sessions reached servers holding drawings
  technique: T1021.001
  rationale: Akira uses RDP. Successful authentication events provide a starting point, but session details
    must identify RDP and its destination.
  query: any where event.code == "4624"
  indices:
  - logs-system.security-*
  assessment: The RDP query failed because the logon type field was absent. The fallback returned successful
    logons only. Obtain session details and identify destination server roles.
  durable: false
  results:
    thackwell:
      hits: 1000
      days: 30
  tested: true
