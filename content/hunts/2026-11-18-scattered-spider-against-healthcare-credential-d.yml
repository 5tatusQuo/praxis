id: 2026-11-18-scattered-spider-against-healthcare-credential-d
prompt: 'Scattered Spider against healthcare: credential dumping, remote access tools and recovery inhibition
  on Windows endpoints'
created: '2026-11-18'
clients:
- acme
summary: The tested commands produced no leads. Missing argument fields required command text matching.
  Missing host identifiers prevented installation correlation. These findings do not exclude other methods
  or establish actor attribution.
hypotheses:
- title: NTDS copies were created with a directory utility
  technique: T1003.003
  rationale: The actor dumps directory credentials. Creating a full directory copy can expose account
    secrets beyond the existing memory dump detection.
  query: 'process where host.os.type == "windows" and event.type == "start" and (process.name : "ntdsutil.exe"
    or ?process.pe.original_file_name : "ntdsutil.exe") and process.command_line : "*cr*fu*"'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching command appeared. The query detects an attempt, not successful extraction. Check
    authorized directory backup procedures before enabling a detection.
  durable: true
  results:
    acme:
      hits: 0
      days: 30
  tested: true
- title: A dump utility targeted LSASS memory
  technique: T1003
  rationale: The actor dumps credentials. A full LSASS dump offers a distinct test beyond the existing
    library behavior.
  query: 'process where host.os.type == "windows" and event.type == "start" and (process.name : "procdump*.exe"
    or ?process.pe.original_file_name : "procdump*") and process.command_line : "* -ma *" and process.command_line
    : "*lsass*"'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching command appeared. Numeric process targets remain outside this test. Check approved
    diagnostic procedures before enabling a detection.
  durable: true
  results:
    acme:
      hits: 0
      days: 30
  tested: true
- title: Configured remote access software ran on Windows
  technique: T1219.002
  rationale: The actor uses remote access software. Guest access parameters and configured installers
    can expose unauthorized access.
  query: 'process where host.os.type == "windows" and event.type == "start" and ((process.name : "ScreenConnect.ClientService.exe"
    and process.command_line : "*?e=Access&y=Guest&h*&k=*") or (process.name : "Syncro.Installer.exe"
    and process.command_line : "*--config-json*" and process.command_line : "*--key*") or process.name
    : ("tvnserver.exe", "winvnc.exe"))'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching launch appeared. Missing host identifiers prevented installation correlation.
    Check approved support software before treating these launches as suspicious.
  durable: false
  results:
    acme:
      hits: 0
      days: 30
  tested: true
- title: Boot settings disabled automatic recovery
  technique: T1490
  rationale: The actor inhibits recovery. Changes to boot recovery settings extend the hunt beyond existing
    shadow copy detection.
  query: 'process where host.os.type == "windows" and event.type == "start" and (process.name : "bcdedit.exe"
    or ?process.pe.original_file_name : "bcdedit.exe") and process.command_line : ("* /set *", "* -set
    *") and (process.command_line : "*bootstatuspolicy ignoreallfailures*" or process.command_line : "*recoveryenabled
    no*")'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching command appeared. Registry telemetry was unavailable for direct state checks.
    Check approved boot maintenance before enabling a detection.
  durable: true
  results:
    acme:
      hits: 0
      days: 30
  tested: true
