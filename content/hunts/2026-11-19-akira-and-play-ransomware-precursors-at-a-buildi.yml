id: 2026-11-19-akira-and-play-ransomware-precursors-at-a-buildi
prompt: 'Akira and Play ransomware precursors at a building contractor and engineering firm: credential
  dumping, shadow copy deletion and staging of drawings for theft on Windows hosts'
created: '2026-11-19'
clients:
- corvenhallow
summary: Process searches found no credential dumping or drawing staging. Deletion samples resemble backup
  maintenance. Missing file telemetry prevents tests of archive contents and completed staging.
hypotheses:
- title: Utilities attempted to dump credential memory
  technique: T1003.001
  rationale: Play uses credential dumping. This search checks additional dump utilities beyond the existing
    detection.
  query: 'process where host.os.type == "windows" and event.type == "start" and ((process.name : ("procdump*.exe",
    "rdrleakdiag.exe", "SqlDumper.exe", "TTTracer.exe", "ProcessDump.exe", "WriteMiniDump.exe") and process.command_line
    : ("*lsass*", "*-ma*", "*/fullmemdmp*", "*0x01100*", "*-dumpFull*")) or (process.name : "rundll32.exe"
    and process.command_line : ("*MiniDump*", "*comsvcs*#*24*")))'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. This search does not exclude other dumping methods. Confirm
    diagnostic workflows before using this broad query for detection.
  durable: false
  results:
    corvenhallow:
      hits: 0
      days: 30
  tested: true
- title: Commands deleted shadow copies before encryption
  technique: T1490
  rationale: The requested precursor warrants review of existing detection results, although the group
    records do not list this technique.
  query: 'process where host.os.type == "windows" and event.type == "start" and ((process.name : "vssadmin.exe"
    and process.command_line : ("*delete*shadows*", "*resize*shadowstorage*")) or (process.name : "wmic.exe"
    and process.command_line : "*shadowcopy*delete*") or (process.name : ("powershell.exe", "pwsh.exe")
    and process.command_line : "*Win32_ShadowCopy*" and process.command_line : ("*Delete*", "*Remove-CimInstance*")))'
  indices:
  - logs-endpoint.events.process-*
  assessment: Samples show a backup agent deleting the oldest shadow copy. Confirm the maintenance schedule
    and review remaining events before treating this activity as benign.
  durable: false
  results:
    corvenhallow:
      hits: 29
      days: 30
  tested: true
- title: Archive commands collected engineering drawings
  technique: T1560.001
  rationale: Both groups archive collected data. Commands that name drawings can expose preparation for
    theft.
  query: 'process where host.os.type == "windows" and event.type == "start" and ((process.name : ("7z.exe",
    "7za.exe", "7zr.exe", "rar.exe", "WinRAR.exe") and process.command_line : "* a *") or (process.name
    : "tar.exe" and process.command_line : ("* -c*", "* --create*")) or (process.name : ("powershell.exe",
    "pwsh.exe") and process.command_line : "*Compress-Archive*")) and process.command_line : ("*.dwg*",
    "*.dxf*", "*.rvt*", "*.ifc*", "*drawings*", "*bim*")'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. Generic directory names can hide drawing collection. Obtain
    file telemetry to verify archive contents. Routine drawing archives need additional context.
  durable: false
  results:
    corvenhallow:
      hits: 0
      days: 30
  tested: true
- title: Copy utilities collected drawings into a staging directory
  technique: T1074.001
  rationale: Local collection can precede the reported archiving behavior. Copy commands can identify
    drawing collection without file telemetry.
  query: 'process where host.os.type == "windows" and event.type == "start" and process.name : ("robocopy.exe",
    "xcopy.exe") and process.command_line : ("*.dwg*", "*.dxf*", "*.rvt*", "*.ifc*", "*drawings*", "*bim*")'
  indices:
  - logs-endpoint.events.process-*
  assessment: No matching commands appeared. Other copy methods remain untested. Obtain file telemetry
    to verify completed staging. Routine project copies prevent standalone detection use.
  durable: false
  results:
    corvenhallow:
      hits: 0
      days: 30
  tested: true
