id: PRX-000016
name: Remote command execution over Windows Remote Management
intent: Detects winrs starting a command on another host, or a shell started by the WinRM
  host process, which attackers use to move between Windows machines.
version: 1
lifecycle: staged
owner: detection-engineering
severity: medium
risk_score: 47
attack:
- technique: T1021.006
  tactic: TA0008
data_components:
- Process Creation
pyramid_tier: ttp
log_sources:
  elastic:
    indices:
    - logs-endpoint.events.process-*
provenance:
  source: praxis
  licence: Apache-2.0
references:
- https://attack.mitre.org/techniques/T1021/006/
false_positives:
- Administrators and management tools that run commands on servers with winrs.
