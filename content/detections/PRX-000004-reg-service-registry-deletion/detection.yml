id: PRX-000004
name: Service registry deletion via reg.exe
intent: Detects reg.exe deleting service registry keys or values, which can disable security
  services and impair defenses.
version: 1
lifecycle: production
owner: ai:platform-engineer-elastic
severity: high
risk_score: 73
attack:
- technique: T1685
  tactic: TA0112
data_components:
- Process Creation
- Command Execution
pyramid_tier: ttp
log_sources:
  elastic:
    indices:
    - logs-endpoint.events.process-*
    - logs-windows.sysmon_operational-*
provenance:
  source: sigmahq
  upstream_id: 05b2aa93-1210-42c8-8d9a-2fcc13b284f5
  upstream_commit: 088855f00b65a19e345b09c1619272b44f92fea4
