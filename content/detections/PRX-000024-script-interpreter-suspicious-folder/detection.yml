id: PRX-000024
name: Script interpreter references a suspicious folder
intent: Detects script interpreters that reference writable folders, which can indicate execution
  of attacker-controlled scripts.
version: 1
lifecycle: staged
owner: ai:platform-engineer-elastic
severity: high
risk_score: 73
attack:
- technique: T1059
  tactic: TA0002
data_components:
- Process Creation
- Command Execution
pyramid_tier: ttp
log_sources:
  elastic:
    indices:
    - logs-endpoint.events.process-*
    - logs-windows.sysmon_operational-*
provenance:
  source: sigmahq
  upstream_id: 1228c958-e64e-4e71-92ad-7d429f4138ba
  upstream_commit: 088855f00b65a19e345b09c1619272b44f92fea4
  upstream_author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
  licence: DRL-1.1
references:
- https://github.com/SigmaHQ/sigma/blob/088855f00b65a19e345b09c1619272b44f92fea4/rules/windows/process_creation/proc_creation_win_susp_script_exec_from_env_folder.yml
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/shuckworm-russia-ukraine-military
- https://www.virustotal.com/gui/file/91ba814a86ddedc7a9d546e26f912c541205b47a853d227756ab1334ade92c3f
- https://learn.microsoft.com/en-us/windows/win32/shell/csidl
false_positives:
- Approved installers and user scripts can reference these folders. Confirm the script contents
  and the approved activity before adding an exception.
