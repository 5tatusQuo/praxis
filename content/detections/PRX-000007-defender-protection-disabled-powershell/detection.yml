id: PRX-000007
name: Microsoft Defender protection disabled with PowerShell
intent: Detects PowerShell turning off Microsoft Defender protection features, a step ransomware
  crews take before they deploy their payload.
version: 1
lifecycle: staged
owner: detection-engineering
severity: high
risk_score: 73
attack:
- technique: T1685
  tactic: TA0112
data_components:
- Process Creation
- Command Execution
pyramid_tier: ttp
log_sources:
  elastic:
    indices:
    - logs-endpoint.events.process-*
provenance:
  source: praxis
  licence: Apache-2.0
references: []
false_positives:
- Endpoint management tools that switch Defender off before installing another antivirus product.
- Administrators who troubleshoot a performance problem by hand.
