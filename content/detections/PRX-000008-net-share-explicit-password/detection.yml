id: PRX-000008
name: Explicit password in net share connection
intent: Detects a password supplied to a net share connection with an explicit account, which
  can indicate account misuse and expose credentials.
version: 1
lifecycle: staged
owner: ai:platform-engineer-elastic
severity: medium
risk_score: 47
attack:
- technique: T1078
  tactic: TA0001
- technique: T1021.002
  tactic: TA0008
data_components:
- Process Creation
- Command Execution
pyramid_tier: tool
log_sources:
  elastic:
    indices:
    - logs-endpoint.events.process-*
    - logs-windows.sysmon_operational-*
provenance:
  source: sigmahq
  upstream_id: d4498716-1d52-438f-8084-4a603157d131
  upstream_commit: 088855f00b65a19e345b09c1619272b44f92fea4
  upstream_author: Tim Shelton (HAWK.IO)
  licence: DRL-1.1
references:
- https://github.com/SigmaHQ/sigma/blob/088855f00b65a19e345b09c1619272b44f92fea4/rules/windows/process_creation/proc_creation_win_net_use_password_plaintext.yml
- https://attack.mitre.org/techniques/T1078/
- https://attack.mitre.org/techniques/T1021/002/
- Internal Research
false_positives:
- Approved scripts can supply passwords when they connect to shared folders. Confirm the account,
  destination, and script owner before an exception.
