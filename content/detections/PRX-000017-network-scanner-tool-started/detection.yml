id: PRX-000017
name: Network scanning tool started on a Windows host
intent: Detects a known network or port scanning tool starting on a Windows host, which ransomware
  crews use to map servers and open services before moving laterally.
version: 1
lifecycle: staged
owner: detection-engineering
severity: medium
risk_score: 47
attack:
- technique: T1046
  tactic: TA0007
data_components:
- Process Creation
pyramid_tier: tool
log_sources:
  elastic:
    indices:
    - logs-endpoint.events.process-*
provenance:
  source: praxis
  licence: Apache-2.0
references:
- https://attack.mitre.org/techniques/T1046/
false_positives:
- IT staff who scan the network for inventory or troubleshooting.
- Vulnerability assessments run by an approved supplier.
