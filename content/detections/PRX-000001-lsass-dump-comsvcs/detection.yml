id: PRX-000001
name: LSASS memory dump via comsvcs.dll MiniDump
intent: >-
  Detects rundll32 calling the MiniDump export of comsvcs.dll, a built-in way
  to dump LSASS process memory and steal credentials without bringing a tool.
version: 2
lifecycle: production
owner: detection-engineering
severity: high
risk_score: 73
attack:
  - technique: T1003.001
    tactic: TA0006
  - technique: T1218.011
    tactic: TA0005
data_components:
  - Process Creation
pyramid_tier: ttp
log_sources:
  elastic:
    indices:
      - logs-endpoint.events.process-*
      - logs-windows.sysmon_operational-*
schedule:
  interval: 5m
  lookback: 6m
provenance:
  source: praxis
  licence: Apache-2.0
references:
  - https://lolbas-project.github.io/lolbas/Libraries/comsvcs/
  - https://attack.mitre.org/techniques/T1003/001/
false_positives:
  - Rare. Some crash-collection or support tooling dumps its own process this way; it does not target LSASS.
  - Vendor support agents that collect a dump of their own process after a crash. Tune these per client by parent executable.
