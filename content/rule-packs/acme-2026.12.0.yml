review:
  verdict: pass
  summary: 'Reviewed all three detection files, independently ran validation/lab replay and rescored each
    exact query using its declared indices. All 42 test cases passed with no validation errors; each scoring
    backtest returned zero hits over 30 days. The pack meets the three-rule budget, targets distinct techniques,
    uses available process telemetry rather than the silent registry stream, and does not duplicate ACME''s
    production detections. No merge-blocking logic defect was found. Current scores are 84/100 with passes=false,
    not the claimed 94/100: each overlap flag points to the candidate''s own staged library entry, so
    this is not evidence of three redundant additions. Reconcile the quality narrative and the RDP exclusion
    claim before human approval.'
  comments:
  - detection_id: PRX-000004
    severity: concern
    comment: "Current scoring returns 84/100, passes=false and 100% similarity to PRX-000004 itself. The\
      \ same self-match occurs for PRX-000005 and PRX-000006; list_detections identifies all three as\
      \ staged, and the coverage snapshot lists only PRX-000001\u2013000003 as deployed. Do not treat\
      \ these self-matches as independent duplicate rules, but do not present 94/100 and passes=true as\
      \ currently verified either. Reconcile the brief, pick rationales and READMEs with the current quality\
      \ objects, distinguishing any historical pre-registration score from current scoring. The tools\
      \ do not independently establish the historical 94-point scores."
  - detection_id: PRX-000005
    severity: concern
    comment: 'The pick rationale says the query includes a TLS-setting exclusion. It does not: both the
      actual query and README explicitly retain SecurityLayer changes, including legitimate SecurityLayer=2
      hardening. Correct the pack rationale. The broad direction-agnostic behavior is otherwise clearly
      documented and is not itself a blocker; add an explicit TLS-hardening expected-fire test to preserve
      this intentional choice.'
  - detection_id: PRX-000006
    severity: concern
    comment: This is a literal inline TCP-stream pattern, not a verified reverse-shell interaction. It
      requires neither receiving commands nor executing received data, and a legitimate TCP sender with
      GetStream and Write will match. The README accurately admits this and names encoded, script-file
      and obfuscated evasions, so the limited scope is acceptable. Current positives exercise interpreter
      and construction variants, but the example event only demonstrates sending bytes. Add a realistic
      command-execution/output-return reverse-shell fixture and an explicitly expected-fire benign TCP-sender
      fixture so reviewers can see both efficacy within scope and the unavoidable false-positive boundary.
  - detection_id: PRX-000004
    severity: note
    comment: Service-tree deletion is a useful attempted-tampering signal, not proof of disabling a security
      tool. The query also matches value removal and ordinary service configuration, while sc.exe and
      direct registry APIs evade it. These limitations are already candidly documented, and the tests
      cover renamed binaries, numbered control sets, root deletion, whitespace and unrelated operations.
      Retain this narrow coverage interpretation rather than treating the T1685 gap as comprehensively
      closed.
