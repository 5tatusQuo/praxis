brief: "ACME healthcare \u2014 December 2026: propose 3 detections for PR/CI and human review. The latest\
  \ available snapshot (2026-11-18) reports 75.64% visibility but only 3.1% threat-weighted coverage,\
  \ with 527 visible detection gaps. Process, command and network telemetry score 4; authentication and\
  \ logon telemetry are available, but registry-modification telemetry is silent. Highest-weight gaps\
  \ include remote services/RDP, command execution, valid accounts and disabling security tools (weight\
  \ 1.0); PowerShell is also prominent (0.833). This pack adds focused RDP-configuration tampering, service-removal\
  \ and PowerShell reverse-shell behaviours using the available endpoint process stream, without depending\
  \ on silent registry events. It does not provide comprehensive RDP or valid-account detection, repair\
  \ blind Run-key coverage, or duplicate the existing LSASS-dump and shadow-copy rules. All three proposed\
  \ queries passed client scoring at 94/100, TTP tier, with zero hits over the 30-day backtest; zero historical\
  \ hits supports a low initial alert burden but does not establish detection efficacy."
