rule: PRX-000002
reason: The backup agent deletes the oldest shadow copy. Exclude only the observed command
  with the exact parent and child paths.
evidence:
- alert:bb50e6bff00e
- alert:00f9c1990bbc
author: ai:tuner
expires: '2027-02-18'
exclude:
- field: process.parent.executable
  op: equals
  value: C:\Program Files\CadVault Backup\cadvault-backup.exe
  also:
  - field: process.executable
    op: equals
    value: C:\Windows\System32\vssadmin.exe
  - field: process.command_line
    op: equals
    value: 'vssadmin.exe delete shadows /for=D: /oldest /quiet'
examples:
- event:
    category:
    - process
    type:
    - start
  host:
    os:
      type: windows
  process:
    name: vssadmin.exe
    executable: C:\Windows\System32\vssadmin.exe
    command_line: 'vssadmin.exe delete shadows /for=D: /oldest /quiet'
    pe:
      original_file_name: VSSADMIN.EXE
    parent:
      name: cadvault-backup.exe
      executable: C:\Program Files\CadVault Backup\cadvault-backup.exe
