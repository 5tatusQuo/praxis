rule: PRX-000002
reason: The backup agent runs a repeated storage resize command. Exclude only this command
  with the observed parent and child paths.
evidence:
- alert:5eabe760e76d
- alert:d61b862f593a
author: ai:tuner (awaiting human approval)
expires: '2027-02-18'
exclude:
- field: process.parent.executable
  op: equals
  value: C:\Program Files\DrawingVault Backup\dvagent.exe
  also:
  - field: process.executable
    op: equals
    value: C:\Windows\System32\vssadmin.exe
  - field: process.command_line
    op: equals
    value: 'vssadmin.exe resize shadowstorage /for=E: /on=E: /maxsize=20%'
examples:
- event:
    category:
    - process
    type:
    - start
  host:
    os:
      type: windows
  process:
    name: vssadmin.exe
    executable: C:\Windows\System32\vssadmin.exe
    command_line: 'vssadmin.exe resize shadowstorage /for=E: /on=E: /maxsize=20%'
    pe:
      original_file_name: VSSADMIN.EXE
    parent:
      name: dvagent.exe
      executable: C:\Program Files\DrawingVault Backup\dvagent.exe
