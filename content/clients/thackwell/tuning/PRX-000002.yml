rule: PRX-000002
reason: The backup agent deletes the oldest shadow copy on drive D. Exclude only its exact
  parent path, tool path, and pruning command.
evidence:
- alert:b861fd98803d
- alert:b51e4b4ea449
author: ai:tuner
expires: '2027-02-19'
exclude:
- field: process.parent.executable
  op: equals
  value: C:\Program Files\SiteBackup\sitebackup-agent.exe
  also:
  - field: process.executable
    op: equals
    value: C:\Windows\System32\vssadmin.exe
  - field: process.command_line
    op: equals
    value: 'vssadmin.exe delete shadows /for=D: /oldest /quiet'
examples:
- event:
    category:
    - process
    type:
    - start
  host:
    os:
      type: windows
  process:
    name: vssadmin.exe
    executable: C:\Windows\System32\vssadmin.exe
    command_line: 'vssadmin.exe delete shadows /for=D: /oldest /quiet'
    pe:
      original_file_name: VSSADMIN.EXE
    parent:
      name: sitebackup-agent.exe
      executable: C:\Program Files\SiteBackup\sitebackup-agent.exe
