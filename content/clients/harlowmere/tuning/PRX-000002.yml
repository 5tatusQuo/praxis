rule: PRX-000002
reason: The backup agent prunes old shadow copies. Exclude only its exact parent path, child
  path, and observed pruning command.
evidence:
- alert:98d2f0a22650
author: ai:tuner
expires: '2027-02-18'
exclude:
- field: process.parent.executable
  op: equals
  value: C:\Program Files\SiteBackup\SiteBackupAgent.exe
  also:
  - field: process.executable
    op: equals
    value: C:\Windows\System32\vssadmin.exe
  - field: process.command_line
    op: equals
    value: 'vssadmin.exe delete shadows /for=E: /oldest /quiet'
examples:
- event:
    category:
    - process
    type:
    - start
  host:
    os:
      type: windows
  process:
    name: vssadmin.exe
    executable: C:\Windows\System32\vssadmin.exe
    command_line: 'vssadmin.exe delete shadows /for=E: /oldest /quiet'
    pe:
      original_file_name: VSSADMIN.EXE
    parent:
      name: SiteBackupAgent.exe
      executable: C:\Program Files\SiteBackup\SiteBackupAgent.exe
