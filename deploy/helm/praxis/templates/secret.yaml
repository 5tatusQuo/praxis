{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels: {{- include "praxis.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-token: {{ required "secrets.apiToken is required" .Values.secrets.apiToken | quote }}
  database-url: {{ include "praxis.databaseUrl" . | quote }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ required "postgres.password is required" .Values.postgres.password | quote }}
  {{- end }}
{{- end }}
