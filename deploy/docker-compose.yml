# PRAXIS stack. Profiles pick the mode:
#   Full mode:    docker compose --profile core --profile elk up -d
#   Connect mode: docker compose --profile core up -d
# Secrets and bind addresses come from deploy/.env (generated on the server by
# deploy/server/bootstrap.sh, never committed).
name: praxis

services:
  # ---- core: both modes --------------------------------------------------
  postgres:
    profiles: [core]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: praxis
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis -d praxis"]
      interval: 5s
      timeout: 5s
      retries: 30

  praxis-api:
    profiles: [core]
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PRAXIS_DATABASE_URL: postgresql://praxis:${POSTGRES_PASSWORD}@postgres:5432/praxis
      PRAXIS_API_TOKEN: ${PRAXIS_API_TOKEN}
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  praxis-web:
    profiles: [core]
    build:
      context: ../web
    restart: unless-stopped
    depends_on:
      praxis-api:
        condition: service_healthy
    environment:
      PRAXIS_API_URL: http://praxis-api:8000
      PRAXIS_API_TOKEN: ${PRAXIS_API_TOKEN}
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"

  # ---- elk: Full mode only -------------------------------------------------
  # One-shot: creates the CA and the node certificate on first start.
  elk-certs:
    profiles: [elk]
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    user: "0"
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./elastic/make-certs.sh:/make-certs.sh:ro
    command: ["bash", "/make-certs.sh"]

  es01:
    profiles: [elk]
    depends_on:
      elk-certs:
        condition: service_completed_successfully
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    restart: unless-stopped
    volumes:
      - certs:/usr/share/elasticsearch/config/certs:ro
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - "${ES_BIND:-127.0.0.1}:9200:9200"
    environment:
      node.name: es01
      cluster.name: praxis
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms${ES_HEAP:-4g} -Xmx${ES_HEAP:-4g}
      bootstrap.memory_lock: "true"
      xpack.license.self_generated.type: basic
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/es01/es01.key
      xpack.security.http.ssl.certificate: certs/es01/es01.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.authc.api_key.enabled: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 10s
      retries: 60

  # One-shot: sets the password Kibana uses to talk to Elasticsearch.
  elk-init:
    profiles: [elk]
    depends_on:
      es01:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs:ro
      - ./elastic/set-kibana-password.sh:/set-kibana-password.sh:ro
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD}
    command: ["bash", "/set-kibana-password.sh"]

  kibana:
    profiles: [elk]
    depends_on:
      elk-init:
        condition: service_completed_successfully
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    restart: unless-stopped
    volumes:
      - certs:/usr/share/kibana/config/certs:ro
      - kibanadata:/usr/share/kibana/data
    ports:
      - "${KIBANA_BIND:-127.0.0.1}:5601:5601"
    environment:
      SERVERNAME: kibana
      ELASTICSEARCH_HOSTS: https://es01:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: config/certs/ca/ca.crt
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_KEY_SECURITY}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_KEY_SAVED_OBJECTS}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_KEY_REPORTING}
      TELEMETRY_OPTIN: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601/api/status | grep -q 'HTTP/1.1 200 OK'"]
      interval: 10s
      timeout: 10s
      retries: 90

volumes:
  pgdata:
  certs:
  esdata01:
  kibanadata:
