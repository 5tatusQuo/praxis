# Install once: uvx pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: praxis-validate
        name: praxis validate (schemas, README template, ATT&CK ids, tuning hooks)
        entry: uv run praxis validate
        language: system
        pass_filenames: false
        files: ^(content/|src/praxis/)
