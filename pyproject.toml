[project]
name = "praxis"
version = "0.1.0"
description = "Multi-tenant, AI-driven detection engineering platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.9",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pysigma>=1.5.1",
    "pysigma-backend-elasticsearch>=2.1.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
praxis = "praxis.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # Typer uses function calls in defaults
    "E501",  # the formatter wraps what it can; long strings may stay long
]

[tool.pytest.ini_options]
testpaths = ["tests"]
